name: Build Smart Azan TV APK

on:
  push:
    paths:
      - "android-tv-app/**"
      - ".github/workflows/build-android-tv.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed so the release-publish step below can create/update a release
    # using the default GITHUB_TOKEN - without this the token is read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No committed Gradle wrapper (nothing here can generate a real
      # gradle-wrapper.jar to commit) - this installs Gradle directly and
      # pins the exact version known to pair with the AGP version in
      # android-tv-app/build.gradle.kts, rather than "latest", since this
      # project may sit untouched for a long time before being built again.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      # Without this, every run gets a fresh CI VM with no ~/.android/debug.keystore,
      # so Android Gradle Plugin auto-generates a NEW random one each time - meaning
      # every build is signed differently and `adb install -r` (update in place)
      # fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE, forcing an uninstall (which
      # also wipes the saved server address) before every single reinstall. Caching
      # the keystore across runs keeps every build signed the same way.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate debug keystore if not cached yet
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        working-directory: android-tv-app
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-azan-tv-debug-apk
          path: android-tv-app/app/build/outputs/apk/debug/*.apk

      # Workflow artifacts (the step above) need a logged-in GitHub session
      # to download - a Release asset is a plain public URL, so this is
      # what makes "curl the latest APK" work from anywhere, including a
      # script on the Smart Azan server itself. The tag is fixed and gets
      # overwritten on every build - this is a rolling "latest", not a
      # versioned release history.
      - name: Publish latest APK as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app-latest
          name: Smart Azan TV (latest build)
          body: >
            Automatically rebuilt from the latest android-tv-app source on every push.
            This is a rolling build, not a version history - see commit history for changes.
          files: android-tv-app/app/build/outputs/apk/debug/*.apk
